<div id="root"></div>
<script type="text/babel">
const {
  useState, useEffect, useRef, useCallback, createContext, useContext
} = React

/* ── Simple hash router ──────────────────────────── */
const RouterCtx = createContext({ route:'/', navigate:()=>{} })

function Router({ children }) {
  const [route, setRoute] = useState(() => window.location.hash.replace('#','') || '/')
  useEffect(() => {
    const h = () => setRoute(window.location.hash.replace('#','') || '/')
    window.addEventListener('hashchange', h)
    return () => window.removeEventListener('hashchange', h)
  }, [])
  const navigate = useCallback(path => { window.location.hash = path }, [])
  return <RouterCtx.Provider value={{ route, navigate }}>{children}</RouterCtx.Provider>
}
function useRouter() { return useContext(RouterCtx) }

/* ── Utilities ───────────────────────────────────── */
function cn(...c) { return c.filter(Boolean).join(' ') }
function uid() { return Math.random().toString(36).slice(2) }

/* ── UI Components ───────────────────────────────── */
function Btn({ children, onClick, disabled, className='', variant='default', size='md' }) {
  const base = 'inline-flex items-center justify-center gap-1.5 rounded-xl font-medium transition-all active:scale-95 disabled:opacity-50 disabled:pointer-events-none cursor-pointer'
  const vars = {
    default:'bg-indigo-600 text-white hover:bg-indigo-700 shadow-md',
    outline:'border-2 border-gray-200 bg-white hover:bg-gray-50 text-gray-700',
    ghost:'hover:bg-gray-100 text-gray-600',
    gradient:'bg-gradient-to-r from-sky-500 to-violet-500 text-white shadow-lg hover:opacity-90',
  }
  const sizes = { sm:'text-xs h-9 px-3', md:'text-sm h-10 px-4' }
  return <button onClick={onClick} disabled={disabled} className={cn(base,vars[variant]||vars.default,sizes[size]||sizes.md,className)}>{children}</button>
}

function Textarea({ value, onChange, onKeyDown, placeholder, rows=3, className='' }) {
  return <textarea value={value} onChange={onChange} onKeyDown={onKeyDown} placeholder={placeholder} rows={rows}
    className={cn('w-full rounded-xl border-2 border-gray-200 bg-white px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:border-indigo-400 resize-none',className)} />
}

function Bar({ pct=0, color='bg-indigo-400' }) {
  return <div className="h-2 w-full bg-gray-100 rounded-full overflow-hidden">
    <div className={cn('h-full rounded-full transition-all duration-500',color)} style={{width:`${pct}%`}} />
  </div>
}

/* ── App State ───────────────────────────────────── */
const AppCtx = createContext(null)
function useApp() { return useContext(AppCtx) }

function AppProvider({ children }) {
  const [ls, setLs] = useState({ sleep:7, exercise:30, water:8, mood:7 })
  const [phq, setPhq] = useState(Array(9).fill(null))
  const [journal, setJournal] = useState([])
  const [chat, setChat] = useState([])

  const v = {
    lifestyleStats: ls,
    setLifestyleStats: p => setLs(pr => ({...pr,...p})),
    phq9Answers: phq,
    setPhq9Answer: (i,v) => setPhq(pr => { const n=[...pr]; n[i]=v; return n }),
    resetPhq9: () => setPhq(Array(9).fill(null)),
    phq9Score: phq.every(a=>a!==null) ? phq.reduce((s,v)=>s+v,0) : null,
    journalEntries: journal,
    addJournalEntry: (c,m) => setJournal(pr => [{id:uid(),date:new Date(),content:c,mood:m},...pr]),
    deleteJournalEntry: id => setJournal(pr => pr.filter(e=>e.id!==id)),
    chatMessages: chat,
    addChatMessage: (r,c) => setChat(pr => [...pr,{id:uid(),role:r,content:c,ts:new Date()}]),
    clearChat: () => setChat([]),
  }
  return <AppCtx.Provider value={v}>{children}</AppCtx.Provider>
}

/* ── Sidebar ─────────────────────────────────────── */

  {path:'/journal',label:'My Journal',icon:I.book},
  {path:'/surveys',label:'PHQ-9 검사',icon:I.clip},
  {path:'/chatbot',label:'AI 상담',icon:I.chat},
  {path:'/analytics',label:'Analytics',icon:I.bar},
]

function Sidebar({ open, onClose }) {
  const { route, navigate } = useRouter()
  return <>
    {open && <div className="fixed inset-0 bg-black/30 z-40 lg:hidden" onClick={onClose} />}
    <aside className={cn('w-60 h-screen flex flex-col bg-white border-r border-gray-100 fixed top-0 left-0 z-50 transition-transform duration-300 lg:relative lg:z-auto lg:translate-x-0 shadow-xl lg:shadow-none', open?'translate-x-0':'-translate-x-full')}>

          <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white">{I.brain}</div>

/* ── Dashboard ───────────────────────────────────── */
function greeting() {
  const h = new Date().getHours()
  if(h<6) return '밤이 깊었네요'; if(h<12) return '좋은 아침이에요'
  if(h<18) return '즐거운 오후예요'; if(h<21) return '편안한 저녁이에요'; return '좋은 밤이에요'
}
function phqSeverityLabel(s) {
  if(s<=4) return '정상'; if(s<=9) return '경미한 우울'
  if(s<=14) return '중간 우울'; if(s<=19) return '약간 심한 우울'; return '심한 우울'
}

  {path:'/chatbot',label:'AI 상담',desc:'언제든 마음을 털어놓을 수 있어요',img:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80'},

]

  {key:'sleep',label:'수면',unit:'시간',min:0,max:12,icon:'🌙',bar:'bg-blue-400',border:'border-blue-100',bg:'bg-blue-50'},
  {key:'exercise',label:'운동',unit:'분',min:0,max:120,icon:'💪',bar:'bg-emerald-400',border:'border-emerald-100',bg:'bg-emerald-50'},
  {key:'water',label:'수분',unit:'잔',min:0,max:16,icon:'💧',bar:'bg-sky-400',border:'border-sky-100',bg:'bg-sky-50'},
  {key:'mood',label:'기분',unit:'/10',min:1,max:10,icon:'😊',bar:'bg-violet-400',border:'border-violet-100',bg:'bg-violet-50'},

  return (

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">

/* ── Journal ─────────────────────────────────────── */

  {v:1,e:'😢',l:'매우 힘들어요',a:'border-blue-400 bg-blue-50'},
  {v:3,e:'😟',l:'좋지 않아요',a:'border-amber-400 bg-amber-50'},
  {v:5,e:'😐',l:'보통이에요',a:'border-gray-400 bg-gray-100'},
  {v:7,e:'😊',l:'좋아요',a:'border-emerald-400 bg-emerald-50'},
  {v:9,e:'😄',l:'아주 좋아요',a:'border-rose-400 bg-rose-50'},
]
const nearest = m => MOODS.reduce((a,b)=>Math.abs(b.v-m)<Math.abs(a.v-m)?b:a)

function JournalPage() {
  const { journalEntries, addJournalEntry, deleteJournalEntry } = useApp()
  const [show, setShow] = useState(false)
  const [text, setText] = useState('')
  const [mood, setMood] = useState(7)
  const save = () => { if(!text.trim()) return; addJournalEntry(text.trim(),mood); setText(''); setShow(false) }
  return (

const PHQ_Q=['일을 하는 데 흥미나 즐거움이 거의 없다','기분이 가라앉거나 우울하거나 절망적이다','잠들기 어렵거나 자꾸 깨거나 잠을 너무 많이 잔다','피곤함을 느끼거나 기운이 없다','식욕이 없거나 너무 많이 먹는다','나 자신에 대해 나쁘게 느끼거나 실패자라고 느낀다','신문이나 TV를 볼 때 집중하기 어렵다','다른 사람이 알아챌 정도로 행동이 느려지거나 들떠 있다','죽는 것이 낫겠다거나 자해를 하려는 생각이 든다']

const sev=s=>{
  if(s<=4)  return {l:'정상',d:'우울 증상이 없거나 매우 경미해요.',g:'from-emerald-400 to-teal-400',t:'text-emerald-700',b:'bg-emerald-50 border-emerald-200'}
  if(s<=9)  return {l:'경미 우울',d:'경미한 증상이에요. 생활 습관 관리가 도움이 될 수 있어요.',g:'from-yellow-400 to-amber-400',t:'text-yellow-700',b:'bg-yellow-50 border-yellow-200'}
  if(s<=14) return {l:'중간 우울',d:'중등도 증상이에요. 전문 상담을 고려해 보세요.',g:'from-orange-400 to-amber-500',t:'text-orange-700',b:'bg-orange-50 border-orange-200'}

  return         {l:'심한 우울',d:'즉시 전문의의 도움을 받으세요.',g:'from-rose-500 to-pink-600',t:'text-rose-700',b:'bg-rose-50 border-rose-200'}
}

const RESP={
  sad:['그 감정이 정말 힘드셨겠어요. 슬픔을 느끼는 것은 자연스러운 일이에요. 오늘 어떤 일이 있었는지 더 이야기해 주실 수 있을까요?','지금 마음이 많이 무거울 것 같아요. 충분히 울어도 괜찮아요. 당신 곁에 있을게요.'],
  anxious:['불안감을 느끼고 계시는군요. 잠시 함께 깊은 호흡을 해보세요. 현재 무엇이 가장 걱정되시나요?','걱정이 많이 되시는군요. 지금 통제할 수 있는 것과 그렇지 않은 것을 나눠 생각해 보세요.'],
  stress:['스트레스가 많이 쌓이셨군요. 작은 것부터 하나씩 해결하다 보면 조금씩 가벼워질 거예요.'],
  sleep:['수면은 멘탈 헬스의 기초예요. 잠들기 전 1시간은 화면 사용을 줄이고 따뜻한 차 한 잔을 마셔보세요.'],
  happy:['오늘 행복하시군요! 그 기쁨을 일기에 남겨두세요. 좋은 순간들을 기록하면 나중에 큰 위로가 돼요.'],
  d:['말씀해 주셔서 감사해요. 조금 더 자세히 이야기해 주실 수 있어요?','그렇군요. 오늘 하루에 대해 더 이야기해 주세요.','당신의 마음 건강이 가장 중요해요. 오늘 자신을 위해 어떤 작은 일을 해줄 수 있을까요?'],
}
function mock(t) {
  const s = t.toLowerCase()
  const p = /(슬프|우울|힘들어|지쳐|절망)/.test(s)?RESP.sad:/(불안|걱정|두렵)/.test(s)?RESP.anxious:/(스트레스|힘들다)/.test(s)?RESP.stress:/(잠|수면|불면)/.test(s)?RESP.sleep:/(행복|좋아|기쁘)/.test(s)?RESP.happy:RESP.d
  return p[Math.floor(Math.random()*p.length)]
}

function ChatbotPage() {
  const { chatMessages, addChatMessage, clearChat } = useApp()
  const [input, setInput] = useState('')
  const [typing, setTyping] = useState(false)

  useEffect(()=>ref.current?.scrollIntoView({behavior:'smooth'}),[chatMessages,typing])
  const send = async () => {
    const t=input.trim(); if(!t||typing) return
    setInput(''); addChatMessage('user',t); setTyping(true)
    await new Promise(r=>setTimeout(r,900+Math.random()*600))
    addChatMessage('assistant',mock(t)); setTyping(false)
  }
  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,overflow:'hidden',background:'linear-gradient(135deg,#f8fafc,#f0f9ff)'}}>
      <div className="flex items-center justify-between px-4 sm:px-6 py-4 bg-white/80 backdrop-blur-md border-b border-gray-200 shrink-0">

        {chatMessages.length>0&&<button onClick={clearChat} className="text-xs text-gray-400 hover:text-red-400 px-3 py-1.5 rounded-lg hover:bg-red-50 flex items-center gap-1">{I.trash} 대화 지우기</button>}
      </div>
      <div className="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-4">
        {chatMessages.length===0&&<div className="flex flex-col items-center justify-center h-full text-center py-12">
          <div className="text-6xl mb-5">💬</div>
          <h3 className="text-lg font-bold text-gray-700">어떤 이야기든 나누어요</h3>
          <p className="text-sm text-gray-400 mt-1 max-w-xs">오늘의 기분, 걱정, 또는 근황 어떤 것이든 이야기하세요.</p>
          <div className="mt-6 flex flex-wrap gap-2 justify-center">
            {['오늘 힘든 일이 있어요','스트레스가 쌓였어요','잠을 못 잘 자요'].map(s=><button key={s} onClick={()=>setInput(s)} className="px-4 py-2 rounded-full text-sm bg-white border border-gray-200 text-gray-600 hover:border-teal-300 hover:text-teal-700 shadow-sm transition-colors">{s}</button>)}
          </div>
        </div>}
        {chatMessages.map(m=>(
          <div key={m.id} className={cn('flex gap-2.5 fade-up',m.role==='user'?'justify-end':'justify-start')}>
            {m.role==='assistant'&&<div className="w-8 h-8 rounded-xl bg-teal-600 flex items-center justify-center shrink-0 mt-0.5 text-white">{I.bot}</div>}
            <div className={cn('max-w-xs sm:max-w-md rounded-2xl px-4 py-3 text-sm leading-relaxed shadow-sm',m.role==='user'?'bg-indigo-600 text-white rounded-tr-sm':'bg-white text-gray-700 border border-gray-100 rounded-tl-sm')}>
              {m.content}<p className="text-[10px] mt-1.5 opacity-50 text-right">{m.ts.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</p>
            </div>
          </div>
        ))}
        {typing&&<div className="flex gap-2.5"><div className="w-8 h-8 rounded-xl bg-teal-600 flex items-center justify-center shrink-0 text-white">{I.bot}</div><div className="bg-white border border-gray-100 rounded-2xl rounded-tl-sm px-4 py-3"><div className="flex gap-1 items-center" style={{height:20}}><span className="dot"/><span className="dot"/><span className="dot"/></div></div></div>}
        <div ref={ref} />

      <div className="shrink-0 px-4 sm:px-6 py-4 bg-white/90 backdrop-blur-md border-t border-gray-200">

          <button onClick={send} disabled={!input.trim()||typing} className="w-11 h-11 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center shadow-md transition-all active:scale-95 disabled:opacity-50 shrink-0">{I.send}</button>

  const [open, setOpen] = useState(false)
  const { route } = useRouter()
  const pages = { '/':Dashboard, '/journal':JournalPage, '/surveys':SurveysPage, '/chatbot':ChatbotPage, '/analytics':AnalyticsPage }
  const Page = pages[route] || Dashboard
  return (
    <AppProvider>
      <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
        <Sidebar open={open} onClose={()=>setOpen(false)} />
        <div style={{display:'flex',flexDirection:'column',flex:1,minWidth:0,overflow:'hidden'}}>
          <header className="lg:hidden sticky top-0 z-30 flex items-center gap-3 px-4 py-3 bg-white/80 backdrop-blur-md border-b border-gray-100 shrink-0">
            <button onClick={()=>setOpen(true)} className="p-2 rounded-xl hover:bg-gray-100 text-gray-600">{I.menu}</button>
            <div className="flex items-center gap-2">
              <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-violet-400 to-pink-400 flex items-center justify-center text-white">{I.brain}</div>
              <span className="font-bold text-gray-800 text-sm">MindfulAI</span>
            </div>
          </header>
          <main style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}><Page /></main>
        </div>
      </div>
    </AppProvider>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Router><App /></Router>
)
</script>
</body>
</html>
