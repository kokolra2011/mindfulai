function cn(...cls: (string|undefined|false|null)[]) { return cls.filter(Boolean).join(' ') }
function uid() { return Math.random().toString(36).slice(2) }

/* ── Simple UI Components ────────────────────────── */
function Button({ children, onClick, disabled, className='', variant='default', size='default' }: any) {
  const base = 'inline-flex items-center justify-center gap-2 rounded-xl text-sm font-medium transition-all disabled:opacity-50 disabled:pointer-events-none active:scale-95'
  const v: any = {
    default: 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-md',
    outline: 'border-2 border-gray-200 bg-white hover:bg-gray-50 text-gray-700',
    ghost: 'hover:bg-gray-100 text-gray-600',
  }
  const s: any = { default: 'h-10 px-4 py-2', sm: 'h-9 px-3' }
  return <button onClick={onClick} disabled={disabled} className={cn(base, v[variant]||v.default, s[size]||s.default, className)}>{children}</button>
}

function Textarea({ value, onChange, onKeyDown, placeholder, rows=3, className='', ref: _ref }: any) {
  return <textarea ref={_ref} value={value} onChange={onChange} onKeyDown={onKeyDown} placeholder={placeholder} rows={rows}
    className={cn('w-full rounded-xl border-2 border-gray-200 bg-white px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:border-indigo-400 resize-none transition-colors', className)} />
}

function Progress({ value=0, className='' }: any) {
  return <div className={cn('relative h-2 w-full overflow-hidden rounded-full bg-gray-100', className)}>
    <div className="h-full bg-indigo-500 transition-all duration-500 rounded-full" style={{width:`${value||0}%`}} />
  </div>
}

/* ── AppContext ───────────────────────────────────── */
interface LifestyleStats { sleep:number; exercise:number; water:number; mood:number }
interface JournalEntry { id:string; date:Date; content:string; mood:number }
interface ChatMessage { id:string; role:'user'|'assistant'; content:string; timestamp:Date }
type PHQ9Answers = (number|null)[]

interface AppState {
  lifestyleStats: LifestyleStats
  setLifestyleStats: (p: Partial<LifestyleStats>) => void
  phq9Answers: PHQ9Answers
  setPhq9Answer: (i:number, v:number) => void
  resetPhq9: () => void
  phq9Score: number|null
  journalEntries: JournalEntry[]
  addJournalEntry: (c:string, m:number) => void
  deleteJournalEntry: (id:string) => void
  chatMessages: ChatMessage[]
  addChatMessage: (r:'user'|'assistant', c:string) => void
  clearChatMessages: () => void
}

const AppCtx = createContext<AppState|null>(null)
function useApp() {
  const c = useContext(AppCtx)
  if (!c) throw new Error('useApp outside provider')
  return c
}

function AppProvider({ children }: any) {
  const [lifestyleStats, setLS] = useState<LifestyleStats>({ sleep:7, exercise:30, water:8, mood:7 })
  const setLifestyleStats = (p: Partial<LifestyleStats>) => setLS(prev => ({ ...prev, ...p }))
  const [phq9Answers, setPhq9Answers] = useState<PHQ9Answers>(Array(9).fill(null))
  const setPhq9Answer = (i:number, v:number) => setPhq9Answers(prev => { const n=[...prev]; n[i]=v; return n })
  const resetPhq9 = () => setPhq9Answers(Array(9).fill(null))
  const phq9Score = phq9Answers.every(a => a !== null) ? (phq9Answers as number[]).reduce((s,v)=>s+v,0) : null
  const [journalEntries, setJE] = useState<JournalEntry[]>([])
  const addJournalEntry = (c:string, m:number) => setJE(prev => [{ id:uid(), date:new Date(), content:c, mood:m }, ...prev])
  const deleteJournalEntry = (id:string) => setJE(prev => prev.filter(e => e.id !== id))
  const [chatMessages, setCM] = useState<ChatMessage[]>([])
  const addChatMessage = (r:'user'|'assistant', c:string) => setCM(prev => [...prev, { id:uid(), role:r, content:c, timestamp:new Date() }])
  const clearChatMessages = () => setCM([])
  return <AppCtx.Provider value={{ lifestyleStats, setLifestyleStats, phq9Answers, setPhq9Answer, resetPhq9, phq9Score, journalEntries, addJournalEntry, deleteJournalEntry, chatMessages, addChatMessage, clearChatMessages }}>{children}</AppCtx.Provider>
}

/* ── Dashboard ───────────────────────────────────── */
function greeting() {
  const h = new Date().getHours()
  if (h<6) return '밤이 깊었네요'
  if (h<12) return '좋은 아침이에요'
  if (h<18) return '즐거운 오후예요'
  if (h<21) return '편안한 저녁이에요'
  return '좋은 밤이에요'
}
function formatDate() {
  return new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' })
}
function phqLabel(s:number) {
  if (s<=4) return '정상'
  if (s<=9) return '경미한 우울'
  if (s<=14) return '중간 우울'
  if (s<=19) return '약간 심한 우울'
  return '심한 우울'
}

  { value:1, emoji:'😢', label:'매우 힘들어요', active:'border-blue-400 bg-blue-50' },
  { value:3, emoji:'😟', label:'좋지 않아요',  active:'border-amber-400 bg-amber-50' },
  { value:5, emoji:'😐', label:'보통이에요',   active:'border-gray-400 bg-gray-100' },
  { value:7, emoji:'😊', label:'좋아요',       active:'border-emerald-400 bg-emerald-50' },
  { value:9, emoji:'😄', label:'아주 좋아요',  active:'border-rose-400 bg-rose-50' },
]
function closestMood(m:number) { return MOODS.reduce((a,b) => Math.abs(b.value-m) < Math.abs(a.value-m) ? b : a) }

function getSeverity(s:number) {
  if (s<=4)  return { label:'정상',      desc:'우울 증상이 없거나 매우 경미해요.',                   color:'emerald', from:'from-emerald-400', to:'to-teal-400' }
  if (s<=9)  return { label:'경미 우울', desc:'경미한 증상이에요. 생활 습관 관리가 도움이 될 수 있어요.', color:'yellow',  from:'from-yellow-400',  to:'to-amber-400' }
  if (s<=14) return { label:'중간 우울', desc:'중등도 증상이에요. 전문 상담을 고려해 보세요.',          color:'orange',  from:'from-orange-400',  to:'to-amber-500' }
  if (s<=19) return { label:'약간 심한 우울', desc:'전문가와 상담하시길 권장해요.',                    color:'red',     from:'from-red-400',     to:'to-rose-500' }
  return            { label:'심한 우울', desc:'즉시 전문의의 도움을 받으세요.',                       color:'rose',    from:'from-rose-500',    to:'to-pink-600' }
}

const RESPONSES: Record<string, string[]> = {
  sad: ['그 감정이 정말 힘드셨겠어요. 슬픔을 느끼는 것은 자연스러운 일이에요. 오늘 어떤 일이 있었는지 더 이야기해 주실 수 있을까요?', '지금 마음이 많이 무거울 것 같아요. 충분히 울어도 괜찮아요. 당신 곁에 있을게요.'],
  anxious: ['불안감을 느끼고 계시는군요. 잠시 함께 깊은 호흡을 해보세요. 현재 무엇이 가장 걱정되시나요?', '걱정이 많이 되시는군요. 지금 통제할 수 있는 것과 그렇지 않은 것을 나눠 생각해 보세요.'],
  stress: ['스트레스가 많이 쌓이셨군요. 작은 것부터 하나씩 해결하다 보면 조금씩 가벼워질 거예요.', '힘들 때일수록 자신에게 더 많은 연민을 베풀어야 해요.'],
  sleep: ['수면은 멘탈 헬스의 기초예요. 잠들기 전 1시간은 화면 사용을 줄이고 따뜻한 차 한 잔을 마셔보세요.'],
  happy: ['오늘 행복하시군요! 그 기쁨을 일기에 남겨두세요. 좋은 순간들을 기록하면 나중에 큰 위로가 돼요.'],
  default: ['말씀해 주셔서 감사해요. 조금 더 자세히 이야기해 주실 수 있어요?', '그렇군요. 오늘 하루에 대해 더 이야기해 주세요.', '당신의 마음 건강이 가장 중요해요. 오늘 자신을 위해 어떤 작은 일을 해줄 수 있을까요?'],
}
function getMockResponse(msg: string) {
  const t = msg.toLowerCase()
  let pool: string[]
  if (/(슬프|우울|힘들어|지쳐|절망)/.test(t))   pool = RESPONSES['sad'] ?? []
  else if (/(불안|걱정|두렵)/.test(t))            pool = RESPONSES['anxious'] ?? []
  else if (/(스트레스|힘들다|바쁨)/.test(t))      pool = RESPONSES['stress'] ?? []
  else if (/(잠|수면|불면)/.test(t))              pool = RESPONSES['sleep'] ?? []
  else if (/(행복|좋아|기쁘)/.test(t))            pool = RESPONSES['happy'] ?? []
  else                                             pool = RESPONSES['default'] ?? []
  const arr = pool.length > 0 ? pool : (RESPONSES['default'] ?? [])
  return arr[Math.floor(Math.random() * arr.length)] ?? '이야기해 주셔서 감사해요.'
}

  const sendMessage = async () => {
    const text = input.trim()
    if (!text || isTyping) return
    setInput('')
    addChatMessage('user', text)
    setIsTyping(true)
    await new Promise(r => setTimeout(r, 900 + Math.random() * 700))
    addChatMessage('assistant', getMockResponse(text))

          <div className="flex gap-2.5">
            <div className="w-8 h-8 rounded-xl bg-teal-600 flex items-center justify-center shrink-0 shadow-sm text-white"><Icons.Bot /></div>
            <div className="bg-white border border-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm"><div className="flex gap-1 items-center h-5">{[0,1,2].map(i => <div key={i} className="mf-dot" style={{animationDelay:`${i*0.2}s`}} />)}</div></div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      <div className="shrink-0 px-4 sm:px-6 py-4 bg-white/90 backdrop-blur-md border-t border-gray-200">
        <div className="flex gap-3 items-end max-w-3xl mx-auto">
          <Textarea ref={textareaRef} value={input} onChange={(e:any) => setInput(e.target.value)}
            onKeyDown={(e:any) => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); void sendMessage() } }}
            placeholder="메시지를 입력하세요... (Enter 전송)" rows={1} className="flex-1 min-h-[44px] max-h-32" />
          <button onClick={() => void sendMessage()} disabled={!input.trim() || isTyping}
            className="w-11 h-11 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:pointer-events-none shrink-0">
            <Icons.Send />
          </button>
        </div>
      </div>
    </div>
  )
}

/* ── Analytics ───────────────────────────────────── */
function AnalyticsPage() {
  const { journalEntries, lifestyleStats, phq9Score } = useApp()
  const navigate = useNavigate()

  const avgMood = journalEntries.length > 0
    ? (journalEntries.reduce((s,e)=>s+e.mood,0)/journalEntries.length).toFixed(1)
    : lifestyleStats.mood.toFixed(1)

  const phqLabel = phq9Score !== null
    ? (phq9Score<=4?'정상':phq9Score<=9?'경미':phq9Score<=14?'중간':phq9Score<=19?'약심한':'심한')
    : '미실시'

  // Simple SVG mood chart
  const moodData = journalEntries.length >= 2
    ? journalEntries.slice(-7).map(e => ({ label: e.date.toLocaleDateString('ko-KR',{month:'short',day:'numeric'}), value: e.mood }))
    : Array.from({length:7},(_,i) => ({ label:`${i+1}일`, value: 4 + Math.round(Math.sin(i)*2.5+2.5) }))

  const maxMood = 10
  const chartW = 300, chartH = 120
  const pts = moodData.map((d,i) => {
    const x = (i / (moodData.length-1)) * (chartW-40) + 20
    const y = chartH - 10 - (d.value/maxMood)*(chartH-20)
    return `${x},${y}`
  }).join(' ')

  const lifestyleItems = [
    { label:'수면', value: lifestyleStats.sleep, max:12, color:'bg-blue-400', unit:'시간' },
    { label:'운동', value: lifestyleStats.exercise, max:120, color:'bg-emerald-400', unit:'분' },
    { label:'수분', value: lifestyleStats.water, max:16, color:'bg-sky-400', unit:'잔' },
    { label:'기분', value: lifestyleStats.mood, max:10, color:'bg-violet-400', unit:'/10' },
  ]

  return (
    <div className="h-full overflow-y-auto bg-gradient-to-br from-amber-50 to-pink-50">
      <div className="max-w-5xl mx-auto p-4 sm:p-8 space-y-6">
        <div><h1 className="text-2xl font-bold text-gray-800">Analytics</h1><p className="text-sm text-gray-500 mt-0.5">나의 멘탈 헬스 데이터</p></div>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          {[
            { label:'평균 기분 점수', value:avgMood, sub:'10점 만점 기준', emoji:'😊', bg:'bg-violet-50 border-violet-200', text:'text-violet-700' },
            { label:'일기 작성 횟수', value:journalEntries.length, sub:'기록된 기록 수', emoji:'📖', bg:'bg-pink-50 border-pink-200', text:'text-pink-700' },
            { label:'PHQ-9 점수', value: phq9Score !== null ? phq9Score : '미실시', sub: phqLabel, emoji:'📋', bg:'bg-sky-50 border-sky-200', text:'text-sky-700' },
          ].map(c => (
            <div key={c.label} className={cn('rounded-2xl border p-5 flex items-start gap-4', c.bg)}>
              <div className="text-3xl">{c.emoji}</div>
              <div><p className={cn('text-2xl font-black', c.text)}>{c.value}</p><p className="text-xs font-semibold text-gray-700 mt-0.5">{c.label}</p><p className="text-[11px] text-gray-500">{c.sub}</p></div>
            </div>
          ))}
        </div>

        <div className="bg-white rounded-2xl border border-violet-100 shadow-sm p-5">
          <div className="flex items-center gap-2 mb-4"><span className="text-violet-500"><Icons.Trend /></span><h2 className="font-bold text-gray-800 text-sm">기분 변화 추세</h2>{journalEntries.length < 2 && <span className="ml-auto text-[10px] px-2 py-0.5 rounded-full bg-violet-50 text-violet-600 border border-violet-200">데모 데이터</span>}</div>
          <div className="w-full overflow-x-auto">
            <svg viewBox={`0 0 ${chartW} ${chartH+30}`} className="w-full" style={{minWidth:200}}>
              {[2,5,8].map(v => {
                const y = chartH - 10 - (v/maxMood)*(chartH-20)
                return <g key={v}><line x1="15" y1={y} x2={chartW-5} y2={y} stroke="#f0f0f0" strokeWidth="1"/><text x="10" y={y+4} fontSize="9" fill="#aaa" textAnchor="end">{v}</text></g>
              })}
              <polyline fill="none" stroke="#818cf8" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points={pts} />
              {moodData.map((d,i) => {
                const x = (i/(moodData.length-1))*(chartW-40)+20
                const y = chartH-10-(d.value/maxMood)*(chartH-20)
                return <g key={i}><circle cx={x} cy={y} r="4" fill="#818cf8"/><text x={x} y={chartH+20} fontSize="9" fill="#aaa" textAnchor="middle">{d.label}</text></g>
              })}
            </svg>
          </div>
        </div>

        <div className="bg-white rounded-2xl border border-amber-100 shadow-sm p-5">
          <h2 className="font-bold text-gray-800 text-sm mb-5">오늘의 생활 습관</h2>
          <div className="space-y-4">
            {lifestyleItems.map(item => (
              <div key={item.label}>
                <div className="flex justify-between text-xs text-gray-600 mb-1.5"><span className="font-medium">{item.label}</span><span className="font-bold">{item.value} {item.unit}</span></div>
                <div className="h-3 bg-gray-100 rounded-full overflow-hidden">
                  <div className={cn('h-full rounded-full transition-all duration-700', item.color)} style={{width:`${(item.value/item.max)*100}%`}} />
                </div>
              </div>
            ))}
          </div>
        </div>

        {phq9Score === null && (
          <div className="rounded-2xl bg-gradient-to-br from-sky-50 to-violet-50 border border-sky-200 p-5 flex items-center justify-between gap-4">
            <div><p className="font-bold text-gray-800 text-sm">PHQ-9 검사를 시작해보세요</p><p className="text-xs text-gray-500 mt-0.5">우울 상태를 확인하고 분석에 넣어보세요</p></div>
            <Button onClick={() => navigate('/surveys')} size="sm" className="shrink-0 bg-gradient-to-r from-sky-500 to-violet-500 border-0 shadow-md gap-1.5"><Icons.Plus />검사하기</Button>
          </div>
        )}
      </div>
    </div>
  )
}

/* ── App Layout ──────────────────────────────────── */
function TopBar({ onMenuClick }: { onMenuClick:()=>void }) {
  return (
    <header className="lg:hidden sticky top-0 z-30 flex items-center gap-3 px-4 py-3 bg-white/80 backdrop-blur-md border-b border-violet-100 shrink-0">
      <button onClick={onMenuClick} className="p-2 rounded-xl hover:bg-violet-50 text-gray-600 transition-colors" aria-label="Open menu"><Icons.Menu /></button>
      <div className="flex items-center gap-2">
        <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-violet-400 to-pink-400 flex items-center justify-center shadow-sm"><Icons.Brain /></div>
        <span className="font-bold text-gray-800 text-sm">MindfulAI</span>
      </div>
    </header>
  )
}

function Layout() {
  const [sidebarOpen, setSidebarOpen] = useState(false)
  return (
    <div className="flex h-screen overflow-hidden">
      {sidebarOpen && <div className="fixed inset-0 bg-black/30 z-40 lg:hidden" onClick={() => setSidebarOpen(false)} />}
      <Sidebar isOpen={sidebarOpen} onClose={() => setSidebarOpen(false)} />
      <div className="flex flex-col flex-1 min-w-0 overflow-hidden">
        <TopBar onMenuClick={() => setSidebarOpen(true)} />
        <main className="flex-1 overflow-hidden flex flex-col"><Outlet /></main>
      </div>
    </div>
  )
}

function App() {
  return (
    <AppProvider>
      <Routes>
        <Route element={<Layout />}>
          <Route path="/"          element={<Dashboard />}    />
          <Route path="/journal"   element={<JournalPage />}  />
          <Route path="/surveys"   element={<SurveysPage />}  />
          <Route path="/chatbot"   element={<ChatbotPage />}  />
          <Route path="/analytics" element={<AnalyticsPage />}/>
        </Route>
      </Routes>
    </AppProvider>
  )
}

createRoot(document.getElementById('root')!).render(
  <HashRouter><App /></HashRouter>
)
</script>
</body>
</html>
