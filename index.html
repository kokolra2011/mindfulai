<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MindfulAI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans KR','sans-serif']}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3/dist/htm.umd.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
@keyframes bounce{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.dot{width:8px;height:8px;border-radius:50%;background:#6366f1;display:inline-block;animation:bounce 1.4s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
.fu{animation:fadeUp .25s ease-out both}
.lc3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body class="bg-gray-50">
<div id="root"></div>
<script>
const {useState,useEffect,useRef,useCallback,createContext,useContext} = React
const html = htm.bind(React.createElement)

// ── Router ──────────────────────────────────────────
const RCtx = createContext({route:'/',go:()=>{}})
function Router({children}){
  const [route,setRoute] = useState(()=>window.location.hash.replace('#','')||'/')
  useEffect(()=>{
    const h = ()=>setRoute(window.location.hash.replace('#','')||'/')
    window.addEventListener('hashchange',h)
    return ()=>window.removeEventListener('hashchange',h)
  },[])
  const go = useCallback(p=>{window.location.hash=p},[])
  return html`<${RCtx.Provider} value=${{route,go}}>${children}<//>`
}
function useRouter(){return useContext(RCtx)}

// ── Utils ────────────────────────────────────────────
const cn = (...c)=>c.filter(Boolean).join(' ')
const uid = ()=>Math.random().toString(36).slice(2)

// ── State ────────────────────────────────────────────
const ACtx = createContext(null)
const useApp = ()=>useContext(ACtx)

function AppProvider({children}){
  const [ls,setLs] = useState({sleep:7,exercise:30,water:8,mood:7})
  const [phq,setPhq] = useState(Array(9).fill(null))
  const [journal,setJ] = useState([])
  const [chat,setC] = useState([])
  const ctx = {
    ls, setLS: p=>setLs(pr=>({...pr,...p})),
    phq, setPhqA:(i,v)=>setPhq(pr=>{const n=[...pr];n[i]=v;return n}),
    resetPhq:()=>setPhq(Array(9).fill(null)),
    score: phq.every(a=>a!==null) ? phq.reduce((s,v)=>s+v,0) : null,
    journal, addJ:(c,m)=>setJ(pr=>[{id:uid(),date:new Date(),content:c,mood:m},...pr]), delJ:id=>setJ(pr=>pr.filter(e=>e.id!==id)),
    chat, addC:(r,c)=>setC(pr=>[...pr,{id:uid(),role:r,content:c,ts:new Date()}]), clearC:()=>setC([]),
  }
  return html`<${ACtx.Provider} value=${ctx}>${children}<//>`
}

// ── Sidebar ──────────────────────────────────────────
const NAV=[{p:'/',l:'Dashboard',e:'🏠'},{p:'/journal',l:'My Journal',e:'📖'},{p:'/surveys',l:'PHQ-9',e:'📋'},{p:'/chatbot',l:'AI 상담',e:'💬'},{p:'/analytics',l:'Analytics',e:'📊'}]

function Sidebar({open,onClose}){
  const {route,go}=useRouter()
  return html`<div>
    ${open && html`<div class="fixed inset-0 bg-black/30 z-40 lg:hidden" onClick=${onClose}></div>`}
    <aside class=${cn('fixed top-0 left-0 z-50 flex flex-col h-screen w-60 bg-white border-r border-gray-100 shadow-xl transition-transform duration-300 lg:relative lg:z-auto lg:shadow-none lg:translate-x-0', open?'translate-x-0':'-translate-x-full')}>
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-lg">🧠</div>
          <div><p class="font-bold text-gray-900 text-sm">MindfulAI</p><p class="text-[10px] text-gray-400">Mental Wellness</p></div>
        </div>
        <button onClick=${onClose} class="lg:hidden p-1.5 rounded-lg hover:bg-gray-100 text-gray-500 font-bold">✕</button>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-0.5">
        ${NAV.map(({p,l,e})=>{
          const active = p==='/'?route==='/':route.startsWith(p)
          return html`<button key=${p} onClick=${()=>{go(p);onClose()}} class=${cn('w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all',active?'bg-indigo-50 text-indigo-700':'text-gray-600 hover:bg-gray-50')}>
            <span>${e}</span><span class="flex-1 text-left">${l}</span>
            ${active && html`<span class="w-1.5 h-1.5 rounded-full bg-indigo-500 inline-block"></span>`}
          </button>`
        })}
      </nav>
      <div class="px-4 py-4 border-t border-gray-100">
        <div class="rounded-xl bg-indigo-50 border border-indigo-100 p-3">
          <p class="text-xs font-semibold text-indigo-700">마음 건강 파트너</p>
          <p class="text-xs text-indigo-400 mt-0.5">매일 조금씩, 더 나은 나를 만들어요</p>
        </div>
      </div>
    </aside>
  </div>`
}

// ── Dashboard ────────────────────────────────────────
function greet(){const h=new Date().getHours();if(h<6)return '밤이 깊었네요';if(h<12)return '좋은 아침이에요';if(h<18)return '즐거운 오후예요';if(h<21)return '편안한 저녁이에요';return '좋은 밤이에요'}
function phqLbl(s){if(s<=4)return '정상';if(s<=9)return '경미한 우울';if(s<=14)return '중간 우울';if(s<=19)return '약간 심한 우울';return '심한 우울'}

const FEATS=[
  {p:'/journal',l:'My Journal',d:'하루의 감정과 생각을 기록해요',img:'https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=600&q=80'},
  {p:'/surveys',l:'PHQ-9 검사',d:'전문적 우울증 자가 선별 검사',img:'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=600&q=80'},
  {p:'/chatbot',l:'AI 상담',d:'언제든 마음을 털어놓을 수 있어요',img:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80'},
  {p:'/analytics',l:'건강 분석',d:'나의 멘탈 헬스 데이터를 확인해요',img:'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=600&q=80'},
]
const STATS=[
  {k:'sleep',l:'수면',u:'시간',min:0,max:12,e:'🌙',bar:'bg-blue-400',bd:'border-blue-100',bg:'bg-blue-50'},
  {k:'exercise',l:'운동',u:'분',min:0,max:120,e:'💪',bar:'bg-emerald-400',bd:'border-emerald-100',bg:'bg-emerald-50'},
  {k:'water',l:'수분',u:'잔',min:0,max:16,e:'💧',bar:'bg-sky-400',bd:'border-sky-100',bg:'bg-sky-50'},
  {k:'mood',l:'기분',u:'/10',min:1,max:10,e:'😊',bar:'bg-violet-400',bd:'border-violet-100',bg:'bg-violet-50'},
]

function Dashboard(){
  const {ls,setLS,journal,score}=useApp()
  const {go}=useRouter()
  const date=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})
  return html`<div class="h-full overflow-y-auto">
    <!-- Hero -->
    <div class="relative h-96 overflow-hidden">
      <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1920&q=80" class="w-full h-full object-cover" alt=""/>
      <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/30 to-transparent"></div>
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center text-white px-6">
        <p class="text-white/60 text-xs mb-3 tracking-widest uppercase">${date}</p>
        <h1 class="text-3xl sm:text-5xl font-extrabold mb-3 drop-shadow-xl">${greet()}</h1>
        <p class="text-white/70 text-sm mb-6">오늘도 마음 건강을 함께 돌봐요</p>
        ${score!==null && html`<p class="text-white/50 text-xs mb-4">PHQ-9: ${score}점 · ${phqLbl(score)}</p>`}
        <div class="flex gap-3 flex-wrap justify-center">
          <button onClick=${()=>go('/journal')} class="bg-white text-gray-900 px-6 py-2.5 rounded-full font-semibold text-sm shadow-xl hover:bg-gray-100 active:scale-95 transition-all">일기 작성하기</button>
          <button onClick=${()=>go('/chatbot')} class="bg-white/20 text-white px-6 py-2.5 rounded-full font-semibold text-sm border border-white/30 hover:bg-white/30 active:scale-95 transition-all">AI 상담받기</button>
        </div>
      </div>
    </div>
    <!-- Feature cards -->
    <div class="bg-white px-4 sm:px-8 py-12">
      <div class="max-w-5xl mx-auto">
        <h2 class="text-2xl font-bold text-center text-gray-900 mb-2">주요 기능</h2>
        <p class="text-center text-gray-400 text-sm mb-8">당신의 마음 건강을 위한 네 가지 도구</p>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
          ${FEATS.map(f=>html`<button key=${f.p} onClick=${()=>go(f.p)} class="text-left rounded-2xl overflow-hidden bg-white shadow-md hover:shadow-xl border border-gray-100 transition-all duration-300 group">
            <div class="h-36 sm:h-44 overflow-hidden"><img src=${f.img} alt=${f.l} class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/></div>
            <div class="p-3 sm:p-4"><p class="font-bold text-gray-800 text-xs sm:text-sm">${f.l}</p><p class="text-xs text-gray-500 mt-0.5 hidden sm:block">${f.d}</p></div>
          </button>`)}
        </div>
      </div>
    </div>
    <!-- Stats -->
    <div class="bg-gray-50 px-4 sm:px-8 py-10">
      <div class="max-w-5xl mx-auto">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-4">오늘의 생활 지표</p>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
          ${STATS.map(st=>{
            const val=ls[st.k], pct=Math.round(((val-st.min)/(st.max-st.min))*100)
            return html`<div key=${st.k} class=${cn('bg-white rounded-2xl p-4 border shadow-sm',st.bd)}>
              <div class=${cn('w-9 h-9 rounded-xl flex items-center justify-center mb-3 text-xl',st.bg)}>${st.e}</div>
              <p class="text-2xl font-bold text-gray-800">${val}<span class="text-sm font-normal text-gray-400 ml-1">${st.u}</span></p>
              <p class="text-xs text-gray-500 mt-1">${st.l}</p>
              <div class="mt-3 h-2 bg-gray-100 rounded-full overflow-hidden">
                <div class=${cn('h-full rounded-full transition-all',st.bar)} style=${{width:pct+'%'}}></div>
              </div>
              <div class="flex items-center justify-between mt-3">
                <button onClick=${()=>setLS({[st.k]:Math.max(st.min,val-1)})} class="w-7 h-7 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center font-bold text-gray-500">−</button>
                <span class="text-[10px] text-gray-400">${pct}%</span>
                <button onClick=${()=>setLS({[st.k]:Math.min(st.max,val+1)})} class="w-7 h-7 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center font-bold text-gray-500">+</button>
              </div>
            </div>`
          })}
        </div>
      </div>
    </div>
    <!-- Recent Journal -->
    <div class="bg-white px-4 sm:px-8 pb-12 pt-8">
      <div class="max-w-5xl mx-auto">
        <div class="flex items-center justify-between mb-4">
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-widest">📖 최근 일기</p>
          <button onClick=${()=>go('/journal')} class="text-xs text-indigo-500 hover:text-indigo-700 font-medium">전체 보기 →</button>
        </div>
        ${journal.length===0
          ? html`<div class="rounded-2xl border border-dashed border-gray-200 flex flex-col items-center py-12 text-center gap-2"><p class="text-sm text-gray-400">아직 일기가 없어요</p><button onClick=${()=>go('/journal')} class="text-xs text-indigo-500 hover:text-indigo-700">첫 번째 일기 쓰기 →</button></div>`
          : html`<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">${journal.slice(0,3).map(e=>html`<div key=${e.id} class="bg-gray-50 rounded-2xl border border-gray-100 p-4"><div class="flex justify-between mb-2"><span class="text-xs text-gray-400">${e.date.toLocaleDateString('ko-KR',{month:'short',day:'numeric'})}</span><span>${e.mood>=7?'😊':e.mood>=5?'😐':'😟'}</span></div><p class="text-sm text-gray-700 lc3">${e.content}</p></div>`)}</div>`
        }
      </div>
    </div>
  </div>`
}

// ── Journal ──────────────────────────────────────────
const MOODS=[{v:1,e:'😢',l:'매우 힘들어요',a:'border-blue-400 bg-blue-50'},{v:3,e:'😟',l:'좋지 않아요',a:'border-amber-400 bg-amber-50'},{v:5,e:'😐',l:'보통이에요',a:'border-gray-400 bg-gray-100'},{v:7,e:'😊',l:'좋아요',a:'border-emerald-400 bg-emerald-50'},{v:9,e:'😄',l:'아주 좋아요',a:'border-rose-400 bg-rose-50'}]
const nearest = m=>MOODS.reduce((a,b)=>Math.abs(b.v-m)<Math.abs(a.v-m)?b:a)

function JournalPage(){
  const {journal,addJ,delJ}=useApp()
  const [show,setShow]=useState(false)
  const [text,setText]=useState('')
  const [mood,setMood]=useState(7)
  const save=()=>{if(!text.trim())return;addJ(text.trim(),mood);setText('');setShow(false)}
  return html`<div class="h-full overflow-y-auto bg-gradient-to-br from-slate-50 to-violet-50">
    <div class="max-w-3xl mx-auto p-4 sm:p-8">
      <div class="flex items-center justify-between mb-6">
        <div><h1 class="text-2xl font-bold text-gray-800">My Journal</h1><p class="text-sm text-gray-500 mt-0.5">나만의 소중한 일기장</p></div>
        ${!show && html`<button onClick=${()=>setShow(true)} class="flex items-center gap-1.5 bg-indigo-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-md hover:bg-indigo-700 active:scale-95 transition-all">+ 새 일기</button>`}
      </div>
      ${show && html`<div class="bg-white rounded-2xl border border-indigo-200 shadow-lg p-5 mb-6 space-y-4">
        <div class="flex items-center justify-between"><h3 class="font-bold text-gray-800">새 일기 작성</h3><button onClick=${()=>setShow(false)} class="p-1.5 rounded-lg hover:bg-gray-100 text-gray-500 font-bold">✕</button></div>
        <div>
          <p class="text-xs font-semibold text-gray-500 mb-3">오늘의 기분은?</p>
          <div class="flex gap-2 flex-wrap">
            ${MOODS.map(m=>html`<button key=${m.v} onClick=${()=>setMood(m.v)} class=${cn('flex flex-col items-center gap-1 px-3 py-2 rounded-xl border-2 transition-all text-2xl',mood===m.v?cn('scale-105',m.a):'border-transparent bg-gray-50 hover:bg-gray-100')}>${m.e}<span class="text-[10px] text-gray-500">${m.l}</span></button>`)}
          </div>
        </div>
        <div>
          <p class="text-xs font-semibold text-gray-500 mb-2">오늘의 이야기</p>
          <textarea onChange=${e=>setText(e.target.value)} value=${text} placeholder="오늘 어떤 하루를 보냈나요?" rows="4" class="w-full rounded-xl border-2 border-gray-200 px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:border-indigo-400 resize-none"></textarea>
        </div>
        <div class="flex gap-2 justify-end">
          <button onClick=${()=>setShow(false)} class="px-3 py-2 rounded-xl border-2 border-gray-200 text-sm font-medium hover:bg-gray-50">취소</button>
          <button onClick=${save} disabled=${!text.trim()} class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium shadow-md hover:bg-indigo-700 disabled:opacity-50 active:scale-95 transition-all">저장</button>
        </div>
      </div>`}
      ${journal.length===0 && !show
        ? html`<div class="flex flex-col items-center py-24 text-center gap-3"><div class="text-5xl">📓</div><h3 class="text-lg font-bold text-gray-700">첫 번째 일기를 써보세요</h3><p class="text-sm text-gray-400 max-w-xs">매일 하루의 감정을 기록하면 스스로를 더 잘 이해할 수 있어요.</p><button onClick=${()=>setShow(true)} class="mt-2 flex items-center gap-1.5 bg-indigo-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-md">+ 일기 시작하기</button></div>`
        : html`<div class="space-y-4">${journal.map(e=>{
            const m=nearest(e.mood)
            return html`<article key=${e.id} class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
              <div class="flex items-start justify-between gap-4">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-xl">${m.e}</span>
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100">${m.l}</span>
                  <span class="text-xs text-gray-400">📅 ${e.date.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})}</span>
                </div>
                <button onClick=${()=>delJ(e.id)} class="p-1.5 rounded-lg hover:bg-red-50 text-gray-300 hover:text-red-400 transition-colors text-lg shrink-0">🗑</button>
              </div>
              <p class="mt-3 text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">${e.content}</p>
            </article>`
          })}</div>`
      }
    </div>
  </div>`
}

// ── PHQ-9 ────────────────────────────────────────────
const PHQQ=['일을 하는 데 흥미나 즐거움이 거의 없다','기분이 가라앉거나 우울하거나 절망적이다','잠들기 어렵거나 자꾸 깨거나 잠을 너무 많이 잔다','피곤함을 느끼거나 기운이 없다','식욕이 없거나 너무 많이 먹는다','나 자신에 대해 나쁘게 느끼거나 실패자라고 느낀다','집중하기 어렵다','다른 사람이 알아챌 정도로 행동이 느려지거나 들떠 있다','자해를 하려는 생각이 든다']
const PHQO=[{v:0,l:'전혀 없음'},{v:1,l:'며칠 동안'},{v:2,l:'일 주일 이상'},{v:3,l:'거의 매일'}]
function getSev(s){
  if(s<=4)  return{l:'정상',      d:'우울 증상이 없거나 매우 경미해요.',           g:'from-emerald-400 to-teal-400', t:'text-emerald-700', b:'bg-emerald-50 border-emerald-200'}
  if(s<=9)  return{l:'경미 우울', d:'경미한 증상이에요. 생활 습관 관리가 도움이 될 수 있어요.', g:'from-yellow-400 to-amber-400',  t:'text-yellow-700',  b:'bg-yellow-50 border-yellow-200'}
  if(s<=14) return{l:'중간 우울', d:'중등도 증상이에요. 전문 상담을 고려해 보세요.',   g:'from-orange-400 to-amber-500',  t:'text-orange-700',  b:'bg-orange-50 border-orange-200'}
  if(s<=19) return{l:'약간 심한 우울',d:'전문가와 상담하시길 권장해요.',            g:'from-red-400 to-rose-500',     t:'text-red-700',     b:'bg-red-50 border-red-200'}
  return        {l:'심한 우울', d:'즉시 전문의의 도움을 받으세요.',               g:'from-rose-500 to-pink-600',    t:'text-rose-700',    b:'bg-rose-50 border-rose-200'}
}

function SurveysPage(){
  const {phq,setPhqA,resetPhq,score}=useApp()
  const [done,setDone]=useState(false)
  const answered=phq.filter(a=>a!==null).length
  const sv=done&&score!==null?getSev(score):null
  return html`<div class="h-full overflow-y-auto bg-gradient-to-br from-sky-50 to-indigo-50">
    <div class="max-w-2xl mx-auto p-4 sm:p-8">
      <div class="mb-6"><h1 class="text-2xl font-bold text-gray-800">PHQ-9 검사</h1><p class="text-sm text-gray-500 mt-1">지난 2주일 동안 얼마나 자주 다음 문제로 불편하셨나요?</p></div>
      ${sv && score!==null
        ? html`<div class="space-y-4">
            <div class=${cn('rounded-3xl border p-8 text-center',sv.b)}>
              <div class=${cn('w-20 h-20 rounded-full bg-gradient-to-br flex items-center justify-center mx-auto mb-4 shadow-lg text-white',sv.g)}><span class="text-3xl font-black">${score}</span></div>
              <h2 class=${cn('text-2xl font-bold',sv.t)}>${sv.l}</h2>
              <p class="text-sm text-gray-600 mt-2">${sv.d}</p>
            </div>
            ${score>=10 && html`<div class="flex gap-3 p-4 rounded-2xl bg-amber-50 border border-amber-200 items-start"><span class="text-xl shrink-0">⚠️</span><p class="text-sm text-amber-800">점수가 10점 이상입니다. 전문 의료인과 상담을 적극적으로 고려해 보세요.</p></div>`}
            <button onClick=${()=>{resetPhq();setDone(false)}} class="w-full h-12 rounded-xl border-2 border-gray-200 text-sm font-semibold hover:bg-gray-50 transition-all">🔄 다시 검사하기</button>
          </div>`
        : html`<div class="space-y-4">
            <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
              <div class="flex justify-between mb-2"><span class="text-xs text-gray-500">${answered} / ${PHQQ.length} 완료</span><span class="text-xs font-bold text-violet-600">${Math.round(answered/PHQQ.length*100)}%</span></div>
              <div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-violet-400 rounded-full transition-all duration-500" style=${{width:Math.round(answered/PHQQ.length*100)+'%'}}></div></div>
            </div>
            <div class="flex gap-3 p-4 rounded-2xl bg-sky-50 border border-sky-200 items-start">
              <span class="text-base shrink-0">ℹ️</span>
              <p class="text-xs text-sky-700">PHQ-9는 우울증 선별 도구입니다. 의료 진단을 대체하지 않으며 심한 증상에는 전문가 상담이 필요합니다.</p>
            </div>
            ${PHQQ.map((q,qi)=>html`<div key=${qi} class="bg-white rounded-2xl border border-gray-100 p-5">
              <p class="text-sm font-semibold text-gray-800 mb-4"><span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-violet-100 text-violet-700 text-xs font-bold mr-2">${qi+1}</span>${q}</p>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${PHQO.map(o=>html`<button key=${o.v} onClick=${()=>setPhqA(qi,o.v)} class=${cn('px-3 py-2.5 rounded-xl text-xs font-medium border-2 transition-all',phq[qi]===o.v?'border-violet-400 bg-violet-50 text-violet-700 scale-105':'border-gray-100 bg-gray-50 text-gray-600 hover:border-violet-200')}>${o.l}</button>`)}</div>
            </div>`)}
            <button onClick=${()=>answered===PHQQ.length&&setDone(true)} disabled=${answered!==PHQQ.length} class=${cn('w-full h-12 rounded-xl text-sm font-semibold transition-all',answered===PHQQ.length?'bg-gradient-to-r from-sky-500 to-violet-500 text-white shadow-lg hover:opacity-90':'bg-gray-100 text-gray-400 cursor-not-allowed')}>
              ${answered===PHQQ.length?'✓ 결과 확인하기':'답변 후 제출 가능 ('+(PHQQ.length-answered)+'개 남음)'}
            </button>
          </div>`
      }
    </div>
  </div>`
}

// ── Chatbot ──────────────────────────────────────────
const RESP={
  sad:['그 감정이 정말 힘드셨겠어요. 슬픔을 느끼는 것은 자연스러운 일이에요. 오늘 어떤 일이 있었는지 더 이야기해 주실 수 있을까요?','지금 마음이 많이 무거울 것 같아요. 충분히 울어도 괜찮아요. 당신 곁에 있을게요.'],
  anxious:['불안감을 느끼고 계시는군요. 잠시 함께 깊은 호흡을 해보세요. 현재 무엇이 가장 걱정되시나요?'],
  stress:['스트레스가 많이 쌓이셨군요. 작은 것부터 하나씩 해결하다 보면 조금씩 가벼워질 거예요.'],
  sleep:['수면은 멘탈 헬스의 기초예요. 잠들기 전 화면 사용을 줄이고 따뜻한 차 한 잔을 마셔보세요.'],
  happy:['오늘 행복하시군요! 그 기쁨을 일기에 남겨두세요. 좋은 순간들을 기록하면 나중에 큰 위로가 돼요.'],
  d:['말씀해 주셔서 감사해요. 조금 더 자세히 이야기해 주실 수 있어요?','그렇군요. 오늘 하루에 대해 더 이야기해 주세요.','당신의 마음 건강이 가장 중요해요. 오늘 자신을 위해 어떤 작은 일을 해줄 수 있을까요?'],
}
function mock(t){
  const s=t.toLowerCase()
  const p=/(슬프|우울|힘들어|지쳐|절망)/.test(s)?RESP.sad:/(불안|걱정|두렵)/.test(s)?RESP.anxious:/(스트레스|힘들다)/.test(s)?RESP.stress:/(잠|수면|불면)/.test(s)?RESP.sleep:/(행복|좋아|기쁘)/.test(s)?RESP.happy:RESP.d
  return p[Math.floor(Math.random()*p.length)]
}

function ChatbotPage(){
  const {chat,addC,clearC}=useApp()
  const [input,setInput]=useState('')
  const [typing,setTyping]=useState(false)
  const ref=useRef(null)
  useEffect(()=>ref.current?.scrollIntoView({behavior:'smooth'}),[chat,typing])
  const send=async()=>{
    const t=input.trim();if(!t||typing)return
    setInput('');addC('user',t);setTyping(true)
    await new Promise(r=>setTimeout(r,900+Math.random()*600))
    addC('assistant',mock(t));setTyping(false)
  }
  return html`<div class="flex flex-col flex-1 overflow-hidden bg-gradient-to-br from-slate-50 to-sky-50">
    <div class="flex items-center justify-between px-4 sm:px-6 py-4 bg-white/80 backdrop-blur-md border-b border-gray-200 shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-teal-600 flex items-center justify-center shadow-md text-2xl">🤖</div>
        <div><p class="font-semibold text-gray-800 text-sm">AI 멘탈 코치</p><p class="text-xs text-teal-600 font-medium">● 상담 중</p></div>
      </div>
      ${chat.length>0 && html`<button onClick=${clearC} class="text-xs text-gray-400 hover:text-red-400 px-3 py-1.5 rounded-lg hover:bg-red-50 transition-colors">🗑 지우기</button>`}
    </div>
    <div class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-4">
      ${chat.length===0 && html`<div class="flex flex-col items-center justify-center h-full text-center py-12 gap-3">
        <div class="text-6xl">💬</div>
        <h3 class="text-lg font-bold text-gray-700">어떤 이야기든 나누어요</h3>
        <p class="text-sm text-gray-400 max-w-xs">오늘의 기분, 걱정, 또는 근황 어떤 것이든 이야기하세요.</p>
        <div class="flex flex-wrap gap-2 justify-center mt-2">
          ${['오늘 힘든 일이 있어요','스트레스가 쌓였어요','잠을 못 잘 자요'].map(s=>html`<button key=${s} onClick=${()=>setInput(s)} class="px-4 py-2 rounded-full text-sm bg-white border border-gray-200 text-gray-600 hover:border-teal-300 hover:text-teal-700 shadow-sm transition-colors">${s}</button>`)}
        </div>
      </div>`}
      ${chat.map(m=>html`<div key=${m.id} class=${cn('flex gap-2.5 fu',m.role==='user'?'justify-end':'justify-start')}>
        ${m.role==='assistant' && html`<div class="w-8 h-8 rounded-xl bg-teal-600 flex items-center justify-center shrink-0 mt-0.5 text-sm">🤖</div>`}
        <div class=${cn('max-w-xs sm:max-w-md rounded-2xl px-4 py-3 text-sm leading-relaxed shadow-sm',m.role==='user'?'bg-indigo-600 text-white rounded-tr-sm':'bg-white text-gray-700 border border-gray-100 rounded-tl-sm')}>
          ${m.content}
          <p class="text-[10px] mt-1.5 opacity-50 text-right">${m.ts.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</p>
        </div>
      </div>`)}
      ${typing && html`<div class="flex gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-teal-600 flex items-center justify-center shrink-0 text-sm">🤖</div>
        <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm"><div class="flex gap-1 items-center" style=${{height:'20px'}}><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
      </div>`}
      <div ref=${ref}></div>
    </div>
    <div class="shrink-0 px-4 sm:px-6 py-4 bg-white/90 backdrop-blur-md border-t border-gray-200">
      <div class="flex gap-3 items-end max-w-3xl mx-auto">
        <textarea onChange=${e=>setInput(e.target.value)} value=${input} onKeyDown=${e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}} placeholder="메시지를 입력하세요... (Enter 전송)" rows="1" class="flex-1 rounded-xl border-2 border-gray-200 px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-400 resize-none"></textarea>
        <button onClick=${send} disabled=${!input.trim()||typing} class="w-11 h-11 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center shadow-md transition-all active:scale-95 disabled:opacity-50 shrink-0 text-lg">➤</button>
      </div>
    </div>
  </div>`
}

// ── Analytics ────────────────────────────────────────
function AnalyticsPage(){
  const {journal,ls,score}=useApp()
  const {go}=useRouter()
  const avg=journal.length>0?(journal.reduce((s,e)=>s+e.mood,0)/journal.length).toFixed(1):ls.mood.toFixed(1)
  const data=journal.length>=2?journal.slice(-7).map(e=>({l:e.date.toLocaleDateString('ko-KR',{month:'short',day:'numeric'}),v:e.mood})):Array.from({length:7},(_,i)=>({l:`${i+1}일`,v:4+Math.round(Math.sin(i)*2+2)}))
  const W=280,H=90,demo=journal.length<2
  const pts=data.map((d,i)=>({x:(i/(data.length-1))*(W-20)+10, y:H-(d.v/10)*H, l:d.l}))
  return html`<div class="h-full overflow-y-auto bg-gradient-to-br from-amber-50 to-pink-50">
    <div class="max-w-5xl mx-auto p-4 sm:p-8 space-y-6">
      <div><h1 class="text-2xl font-bold text-gray-800">Analytics</h1><p class="text-sm text-gray-500">나의 멘탈 헬스 데이터</p></div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        ${[{l:'평균 기분 점수',v:avg,s:'10점 만점 기준',e:'😊',bg:'bg-violet-50 border-violet-200',t:'text-violet-700'},{l:'일기 작성 횟수',v:journal.length,s:'누적 기록 수',e:'📖',bg:'bg-pink-50 border-pink-200',t:'text-pink-700'},{l:'PHQ-9 점수',v:score!==null?score:'미실시',s:score!==null?phqLbl(score):'검사를 먼저 실시하세요',e:'📋',bg:'bg-sky-50 border-sky-200',t:'text-sky-700'}].map(c=>html`
          <div key=${c.l} class=${cn('rounded-2xl border p-5 flex gap-4',c.bg)}>
            <div class="text-3xl">${c.e}</div>
            <div><p class=${cn('text-2xl font-black',c.t)}>${c.v}</p><p class="text-xs font-semibold text-gray-700">${c.l}</p><p class="text-xs text-gray-500">${c.s}</p></div>
          </div>`)}
      </div>
      <div class="bg-white rounded-2xl border border-violet-100 shadow-sm p-5">
        <div class="flex items-center gap-2 mb-4">
          <span class="text-violet-500">📈</span><h2 class="font-bold text-gray-800 text-sm">기분 변화 추세</h2>
          ${demo && html`<span class="ml-auto text-[10px] px-2 py-0.5 rounded-full bg-violet-50 text-violet-600 border border-violet-200">데모 데이터</span>`}
        </div>
        <svg viewBox="0 0 ${W} ${H+24}" style=${{width:'100%'}}>
          ${[2,5,8].map(v=>{const y=H-(v/10)*H;return html`<g key=${v}><line x1="8" y1=${y} x2=${W} y2=${y} stroke="#f0f0f0" strokeWidth="1"/><text x="6" y=${y+3} fontSize="8" fill="#ccc" textAnchor="end">${v}</text></g>`})}
          <polyline fill="none" stroke="#818cf8" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points=${pts.map(p=>`${p.x},${p.y}`).join(' ')}/>
          ${pts.map((p,i)=>html`<g key=${i}><circle cx=${p.x} cy=${p.y} r="3.5" fill="#818cf8"/><text x=${p.x} y=${H+18} fontSize="8" fill="#aaa" textAnchor="middle">${p.l}</text></g>`)}
        </svg>
      </div>
      <div class="bg-white rounded-2xl border border-amber-100 shadow-sm p-5">
        <h2 class="font-bold text-gray-800 text-sm mb-5">오늘의 생활 습관</h2>
        <div class="space-y-4">
          ${[{l:'수면',v:ls.sleep,m:12,c:'bg-blue-400',u:'시간'},{l:'운동',v:ls.exercise,m:120,c:'bg-emerald-400',u:'분'},{l:'수분',v:ls.water,m:16,c:'bg-sky-400',u:'잔'},{l:'기분',v:ls.mood,m:10,c:'bg-violet-400',u:'/10'}].map(it=>html`
            <div key=${it.l}>
              <div class="flex justify-between text-xs text-gray-600 mb-1.5"><span class="font-medium">${it.l}</span><span class="font-bold">${it.v} ${it.u}</span></div>
              <div class="h-3 bg-gray-100 rounded-full overflow-hidden"><div class=${cn('h-full rounded-full transition-all duration-700',it.c)} style=${{width:((it.v/it.m)*100)+'%'}}></div></div>
            </div>`)}
        </div>
      </div>
      ${score===null && html`<div class="rounded-2xl bg-gradient-to-br from-sky-50 to-violet-50 border border-sky-200 p-5 flex items-center justify-between gap-4">
        <div><p class="font-bold text-gray-800 text-sm">PHQ-9 검사를 시작해보세요</p><p class="text-xs text-gray-500 mt-0.5">우울 상태를 확인하고 분석에 넣어보세요</p></div>
        <button onClick=${()=>go('/surveys')} class="px-4 py-2 rounded-xl bg-gradient-to-r from-sky-500 to-violet-500 text-white text-sm font-medium shrink-0 shadow-md hover:opacity-90 active:scale-95 transition-all">+ 검사하기</button>
      </div>`}
    </div>
  </div>`
}
