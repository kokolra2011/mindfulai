<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindfulAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Noto Sans KR','sans-serif'] } } }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6/dist/react-router-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family:'Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased; }
    @keyframes mf-bounce { 0%,80%,100%{transform:scale(0);opacity:.3} 40%{transform:scale(1);opacity:1} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .mf-dot { width:8px;height:8px;border-radius:50%;background:#6366f1;animation:mf-bounce 1.4s ease-in-out infinite }
    .mf-dot:nth-child(2){animation-delay:.2s} .mf-dot:nth-child(3){animation-delay:.4s}
    .fade-up { animation:fadeUp .25s ease-out both }
    ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-thumb{background:rgba(99,102,241,.3);border-radius:4px}
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

<script type="text/babel">
const {
  useState, useEffect, useRef, useMemo,
  createContext, useContext
} = React
const { createRoot } = ReactDOM
const {
  HashRouter, Routes, Route,
  useNavigate, useLocation, Outlet
} = ReactRouterDOM

/* ── Utility ─────────────────────────────────────── */
function cn(...cls) { return cls.filter(Boolean).join(' ') }
function uid() { return Math.random().toString(36).slice(2) }

/* ── Simple UI Components ────────────────────────── */
function Button({ children, onClick, disabled, className='', variant='default', size='default' }) {
  const base = 'inline-flex items-center justify-center gap-2 rounded-xl text-sm font-medium transition-all disabled:opacity-50 disabled:pointer-events-none active:scale-95'
  const v = {
    default: 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-md',
    outline: 'border-2 border-gray-200 bg-white hover:bg-gray-50 text-gray-700',
    ghost: 'hover:bg-gray-100 text-gray-600',
  }
  const s = { default: 'h-10 px-4 py-2', sm: 'h-9 px-3' }
  return <button onClick={onClick} disabled={disabled} className={cn(base, v[variant]||v.default, s[size]||s.default, className)}>{children}</button>
}

function Textarea({ value, onChange, onKeyDown, placeholder, rows=3, className='' }) {
  return <textarea value={value} onChange={onChange} onKeyDown={onKeyDown} placeholder={placeholder} rows={rows}
    className={cn('w-full rounded-xl border-2 border-gray-200 bg-white px-3 py-2 text-sm placeholder-gray-400 focus:outline-none focus:border-indigo-400 resize-none transition-colors', className)} />
}

function Progress({ value=0, className='' }) {
  return <div className={cn('relative h-2 w-full overflow-hidden rounded-full bg-gray-100', className)}>
    <div className="h-full bg-indigo-500 transition-all duration-500 rounded-full" style={{width:`${value||0}%`}} />
  </div>
}

/* ── Icons ───────────────────────────────────────── */
const Ic = ({ d, cls='' }) => <svg className={cn('inline-block',cls)} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>
const Icons = {
  Brain:    ()=><Ic cls="w-4 h-4" d={<><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></>}/>,
  Menu:     ()=><Ic cls="w-5 h-5" d={<><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></>}/>,
  X:        ()=><Ic cls="w-4 h-4" d={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>}/>,
  Home:     ()=><Ic cls="w-4 h-4" d={<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>}/>,
  Book:     ()=><Ic cls="w-4 h-4" d={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>}/>,
  Clip:     ()=><Ic cls="w-4 h-4" d={<><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></>}/>,
  Chat:     ()=><Ic cls="w-4 h-4" d={<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>}/>,
  Bar:      ()=><Ic cls="w-4 h-4" d={<><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></>}/>,
  Trash:    ()=><Ic cls="w-4 h-4" d={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>}/>,
  Send:     ()=><Ic cls="w-4 h-4" d={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>}/>,
  Bot:      ()=><Ic cls="w-4 h-4" d={<><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></>}/>,
  Plus:     ()=><Ic cls="w-4 h-4" d={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>}/>,
  Minus:    ()=><Ic cls="w-3 h-3" d={<line x1="5" y1="12" x2="19" y2="12"/>}/>,
  Check:    ()=><Ic cls="w-5 h-5" d={<polyline points="20 6 9 17 4 12"/>}/>,
  Refresh:  ()=><Ic cls="w-4 h-4" d={<><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></>}/>,
  Alert:    ()=><Ic cls="w-5 h-5" d={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>}/>,
  Info:     ()=><Ic cls="w-4 h-4" d={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>}/>,
  Moon:     ()=><Ic cls="w-4 h-4" d={<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>}/>,
  Dumbbell: ()=><Ic cls="w-4 h-4" d={<><path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M4 8v8"/><path d="M20 8v8"/><path d="M2 9v6"/><path d="M22 9v6"/></>}/>,
  Drop:     ()=><Ic cls="w-4 h-4" d={<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>}/>,
  Smile:    ()=><Ic cls="w-4 h-4" d={<><circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></>}/>,
  Cal:      ()=><Ic cls="w-3 h-3" d={<><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>}/>,
  Arrow:    ()=><Ic cls="w-3 h-3" d={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>}/>,
  Trend:    ()=><Ic cls="w-4 h-4" d={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>}/>,
}

/* ── AppContext ───────────────────────────────────── */
const AppCtx = createContext(null)
function useApp() { return useContext(AppCtx) }

function AppProvider({ children }) {
  const [ls, setLsState] = useState({ sleep:7, exercise:30, water:8, mood:7 })
  const setLifestyleStats = p => setLsState(prev => ({ ...prev, ...p }))
  const [phq9, setPhq9] = useState(Array(9).fill(null))
  const setPhq9Answer = (i, v) => setPhq9(prev => { const n=[...prev]; n[i]=v; return n })
  const resetPhq9 = () => setPhq9(Array(9).fill(null))
  const phq9Score = phq9.every(a => a !== null) ? phq9.reduce((s,v)=>s+v,0) : null
  const [journal, setJournal] = useState([])
  const addJournalEntry = (c, m) => setJournal(prev => [{ id:uid(), date:new Date(), content:c, mood:m }, ...prev])
  const deleteJournalEntry = id => setJournal(prev => prev.filter(e => e.id !== id))
  const [chat, setChat] = useState([])
  const addChatMessage = (r, c) => setChat(prev => [...prev, { id:uid(), role:r, content:c, timestamp:new Date() }])
  const clearChatMessages = () => setChat([])
  return <AppCtx.Provider value={{ lifestyleStats:ls, setLifestyleStats, phq9Answers:phq9, setPhq9Answer, resetPhq9, phq9Score, journalEntries:journal, addJournalEntry, deleteJournalEntry, chatMessages:chat, addChatMessage, clearChatMessages }}>{children}</AppCtx.Provider>
}

/* ── Sidebar ─────────────────────────────────────── */
const NAV = [
  { path:'/', label:'Dashboard', Icon: Icons.Home },
  { path:'/journal', label:'My Journal', Icon: Icons.Book },
  { path:'/surveys', label:'PHQ-9 검사', Icon: Icons.Clip },
  { path:'/chatbot', label:'AI 상담', Icon: Icons.Chat },
  { path:'/analytics', label:'Analytics', Icon: Icons.Bar },
]

function Sidebar({ isOpen, onClose }) {
  const { pathname } = useLocation()
  const navigate = useNavigate()
  return (
    <aside className={cn('w-64 shrink-0 h-screen flex flex-col bg-white border-r border-gray-100 fixed top-0 left-0 z-50 lg:relative lg:z-auto transition-transform duration-300 shadow-xl lg:shadow-none', isOpen?'translate-x-0':'-translate-x-full lg:translate-x-0')}>
      <div className="flex items-center justify-between px-5 py-5 border-b border-gray-100">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-md text-white"><Icons.Brain /></div>
          <div><p className="font-bold text-gray-900 text-sm">MindfulAI</p><p className="text-[10px] text-gray-400 tracking-wide">Mental Wellness</p></div>
        </div>
        <button onClick={onClose} className="lg:hidden p-1.5 rounded-lg hover:bg-gray-100 text-gray-400"><Icons.X /></button>
      </div>
      <nav className="flex-1 px-3 py-4 space-y-0.5">
        {NAV.map(({ path, label, Icon }) => {
          const active = path==='/' ? pathname==='/' : pathname.startsWith(path)
          return <button key={path} onClick={() => { navigate(path); onClose() }} className={cn('w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all', active?'bg-indigo-50 text-indigo-700':'text-gray-600 hover:bg-gray-50 hover:text-gray-900')}>
            <span className={active?'text-indigo-600':'text-gray-400'}><Icon /></span>
            {label}
            {active && <div className="ml-auto w-1.5 h-1.5 rounded-full bg-indigo-500" />}
          </button>
        })}
      </nav>
      <div className="px-4 py-4 border-t border-gray-100">
        <div className="rounded-xl bg-indigo-50 border border-indigo-100 p-3.5">
          <p className="text-xs font-semibold text-indigo-700">마음 건강 파트너</p>
          <p className="text-[11px] text-indigo-400 mt-0.5">매일 조금씩, 더 나은 나를 만들어요</p>
        </div>
      </div>
    </aside>
  )
}

/* ── Dashboard ───────────────────────────────────── */
function greeting() {
  const h = new Date().getHours()
  if(h<6) return '밤이 깊었네요'; if(h<12) return '좋은 아침이에요'
  if(h<18) return '즐거운 오후예요'; if(h<21) return '편안한 저녁이에요'; return '좋은 밤이에요'
}
function phqLabel(s) { if(s<=4)return '정상'; if(s<=9)return '경미한 우울'; if(s<=14)return '중간 우울'; if(s<=19)return '약간 심한 우울'; return '심한 우울' }

const FEATURES = [
  { path:'/journal', label:'My Journal', desc:'하루의 감정과 생각을 기록해요', img:'https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=600&q=80', Icon:Icons.Book },
  { path:'/surveys', label:'PHQ-9 검사', desc:'전문적 우울증 자가 선별 검사', img:'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=600&q=80', Icon:Icons.Clip },
  { path:'/chatbot', label:'AI 상담', desc:'언제든 마음을 털어놓을 수 있어요', img:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80', Icon:Icons.Chat },
  { path:'/analytics', label:'건강 분석', desc:'나의 멘탈 헬스 데이터를 확인해요', img:'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=600&q=80', Icon:Icons.Bar },
]
const STATS = [
  { key:'sleep', label:'수면', unit:'시간', min:0, max:12, Icon:Icons.Moon, bg:'bg-blue-50', ic:'text-blue-500', bar:'bg-blue-400', border:'border-blue-100' },
  { key:'exercise', label:'운동', unit:'분', min:0, max:120, Icon:Icons.Dumbbell, bg:'bg-emerald-50', ic:'text-emerald-500', bar:'bg-emerald-400', border:'border-emerald-100' },
  { key:'water', label:'수분', unit:'잔', min:0, max:16, Icon:Icons.Drop, bg:'bg-sky-50', ic:'text-sky-500', bar:'bg-sky-400', border:'border-sky-100' },
  { key:'mood', label:'기분', unit:'/10', min:1, max:10, Icon:Icons.Smile, bg:'bg-violet-50', ic:'text-violet-500', bar:'bg-violet-400', border:'border-violet-100' },
]

function StatCard({ cfg, value, onChange }) {
  const { label, unit, min, max, Icon, bg, ic, bar, border } = cfg
  const pct = Math.round(((value-min)/(max-min))*100)
  return (
    <div className={cn('bg-white rounded-2xl p-4 border shadow-sm hover:shadow-md transition-shadow', border)}>
      <div className={cn('w-9 h-9 rounded-xl flex items-center justify-center mb-3', bg)}><span className={ic}><Icon /></span></div>
      <p className="text-2xl font-bold text-gray-800">{value}<span className="text-sm font-normal text-gray-400 ml-1">{unit}</span></p>
      <p className="text-xs text-gray-500 mt-1">{label}</p>
      <div className="mt-3 h-1.5 bg-gray-100 rounded-full overflow-hidden"><div className={cn('h-full rounded-full transition-all duration-300', bar)} style={{width:`${pct}%`}} /></div>
      <div className="flex items-center justify-between mt-3">
        <button onClick={()=>onChange(Math.max(min,value-1))} className="w-7 h-7 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-colors"><Icons.Minus /></button>
        <span className="text-[10px] text-gray-400">{pct}%</span>
        <button onClick={()=>onChange(Math.min(max,value+1))} className="w-7 h-7 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-colors"><Icons.Plus /></button>
      </div>
    </div>
  )
}

function Dashboard() {
  const { lifestyleStats, setLifestyleStats, journalEntries, phq9Score } = useApp()
  const navigate = useNavigate()
  const date = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' })
  return (
    <div className="h-full overflow-y-auto bg-gray-50">
      <div className="relative h-96 w-full overflow-hidden">
        <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1920&q=80" alt="hero" className="w-full h-full object-cover" />
        <div className="absolute inset-0 bg-gradient-to-t from-black/75 via-black/35 to-black/10" />
        <div className="absolute inset-0 flex flex-col items-center justify-center text-center text-white px-6">
          <p className="text-white/60 text-xs mb-3 tracking-widest uppercase">{date}</p>
          <h1 className="text-3xl sm:text-5xl font-extrabold drop-shadow-xl mb-4">{greeting()}</h1>
          <p className="text-white/75 text-sm max-w-md mb-6">오늘도 마음 건강을 함께 돌봐요</p>
          {phq9Score !== null && <p className="text-white/55 text-xs mb-4">PHQ-9: {phq9Score}점 · {phqLabel(phq9Score)}</p>}
          <div className="flex gap-3 flex-wrap justify-center">
            <button onClick={()=>navigate('/journal')} className="bg-white text-gray-900 px-7 py-2.5 rounded-full font-semibold text-sm shadow-xl hover:bg-gray-100 active:scale-95 transition-all">일기 작성하기</button>
            <button onClick={()=>navigate('/chatbot')} className="bg-white/15 backdrop-blur-sm text-white px-7 py-2.5 rounded-full font-semibold text-sm border border-white/30 hover:bg-white/25 active:scale-95 transition-all">AI 상담받기</button>
          </div>
        </div>
      </div>
      <div className="bg-white px-4 sm:px-8 py-12">
        <div className="max-w-5xl mx-auto">
          <h2 className="text-2xl font-bold text-center text-gray-900 mb-2">주요 기능</h2>
          <p className="text-center text-gray-400 text-sm mb-8">당신의 마음 건강을 위한 네 가지 도구</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {FEATURES.map(f => (
              <button key={f.path} onClick={()=>navigate(f.path)} className="group text-left rounded-2xl overflow-hidden bg-white shadow-md hover:shadow-2xl border border-gray-100 transition-all duration-300">
                <div className="h-44 overflow-hidden"><img src={f.img} alt={f.label} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" /></div>
                <div className="p-4"><div className="flex items-center gap-2 mb-1"><span className="text-indigo-500"><f.Icon /></span><p className="font-bold text-gray-800 text-sm">{f.label}</p></div><p className="text-xs text-gray-500">{f.desc}</p></div>
              </button>
            ))}
          </div>
        </div>
      </div>
      <div className="px-4 sm:px-8 py-10 bg-gray-50">
        <div className="max-w-5xl mx-auto">
          <h2 className="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-4">오늘의 생활 지표</h2>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            {STATS.map(cfg => <StatCard key={cfg.key} cfg={cfg} value={lifestyleStats[cfg.key]} onChange={v=>setLifestyleStats({[cfg.key]:v})} />)}
          </div>
        </div>
      </div>
      <div className="px-4 sm:px-8 pb-12 bg-white">
        <div className="max-w-5xl mx-auto pt-8">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-2"><span className="text-indigo-500"><Icons.Book /></span><h2 className="text-xs font-semibold text-gray-500 uppercase tracking-widest">최근 일기</h2></div>
            <button onClick={()=>navigate('/journal')} className="flex items-center gap-1 text-xs text-indigo-500 hover:text-indigo-700 font-medium">전체 보기 <Icons.Arrow /></button>
          </div>
          {journalEntries.length === 0
            ? <div className="rounded-2xl border border-dashed border-gray-200 flex flex-col items-center py-12 text-center"><p className="text-sm text-gray-400">아직 일기가 없어요</p><button onClick={()=>navigate('/journal')} className="mt-2 text-xs text-indigo-500 hover:text-indigo-700">첫 번째 일기 쓰기 →</button></div>
            : <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">{journalEntries.slice(0,3).map(e=><div key={e.id} className="bg-gray-50 rounded-2xl border border-gray-100 p-4"><div className="flex items-center justify-between mb-2"><span className="text-xs text-gray-400">{e.date.toLocaleDateString('ko-KR',{month:'short',day:'numeric'})}</span><span>{e.mood>=7?'😊':e.mood>=5?'😐':'😟'}</span></div><p className="text-sm text-gray-700 line-clamp-3">{e.content}</p></div>)}</div>
          }
        </div>

const RESP = {
  sad:     ['그 감정이 정말 힘드셨겠어요. 슬픔을 느끼는 것은 자연스러운 일이에요. 오늘 어떤 일이 있었는지 더 이야기해 주실 수 있을까요?', '지금 마음이 많이 무거울 것 같아요. 충분히 울어도 괜찮아요. 당신 곁에 있을게요.'],
  anxious: ['불안감을 느끼고 계시는군요. 잠시 함께 깊은 호흡을 해보세요. 현재 무엇이 가장 걱정되시나요?', '걱정이 많이 되시는군요. 지금 통제할 수 있는 것과 그렇지 않은 것을 나눠 생각해 보세요.'],
  stress:  ['스트레스가 많이 쌓이셨군요. 작은 것부터 하나씩 해결하다 보면 조금씩 가벼워질 거예요.'],
  sleep:   ['수면은 멘탈 헬스의 기초예요. 잠들기 전 1시간은 화면 사용을 줄이고 따뜻한 차 한 잔을 마셔보세요.'],
  happy:   ['오늘 행복하시군요! 그 기쁨을 일기에 남겨두세요.'],
  default: ['말씀해 주셔서 감사해요. 조금 더 자세히 이야기해 주실 수 있어요?', '그렇군요. 오늘 하루에 대해 더 이야기해 주세요.', '당신의 마음 건강이 가장 중요해요. 오늘 자신을 위해 어떤 작은 일을 해줄 수 있을까요?'],
}
function getMock(msg) {
  const t = msg.toLowerCase()
  const pool = /(슬프|우울|힘들어|지쳐|절망)/.test(t)?RESP.sad:/(불안|걱정|두렵)/.test(t)?RESP.anxious:/(스트레스|힘들다)/.test(t)?RESP.stress:/(잠|수면|불면)/.test(t)?RESP.sleep:/(행복|좋아|기쁘)/.test(t)?RESP.happy:RESP.default
  return pool[Math.floor(Math.random()*pool.length)]
}

    <div className="flex flex-col flex-1 overflow-hidden bg-gradient-to-br from-slate-50 to-sky-50">

          <h2 className="font-bold text-gray-800 text-sm mb-5">오늘의 생활 습관</h2>
          <div className="space-y-4">
            {[{label:'수면',value:lifestyleStats.sleep,max:12,bar:'bg-blue-400',unit:'시간'},{label:'운동',value:lifestyleStats.exercise,max:120,bar:'bg-emerald-400',unit:'분'},{label:'수분',value:lifestyleStats.water,max:16,bar:'bg-sky-400',unit:'잔'},{label:'기분',value:lifestyleStats.mood,max:10,bar:'bg-violet-400',unit:'/10'}].map(item=>(
              <div key={item.label}>
                <div className="flex justify-between text-xs text-gray-600 mb-1.5"><span className="font-medium">{item.label}</span><span className="font-bold">{item.value} {item.unit}</span></div>
                <div className="h-3 bg-gray-100 rounded-full overflow-hidden"><div className={cn('h-full rounded-full transition-all duration-700',item.bar)} style={{width:`${(item.value/item.max)*100}%`}} /></div>
              </div>
            ))}
          </div>
        </div>
        {phq9Score===null && (
          <div className="rounded-2xl bg-gradient-to-br from-sky-50 to-violet-50 border border-sky-200 p-5 flex items-center justify-between gap-4">
            <div><p className="font-bold text-gray-800 text-sm">PHQ-9 검사를 시작해보세요</p><p className="text-xs text-gray-500 mt-0.5">우울 상태를 확인하고 분석에 넣어보세요</p></div>
            <Button onClick={()=>navigate('/surveys')} size="sm" className="shrink-0 bg-gradient-to-r from-sky-500 to-violet-500 border-0 shadow-md gap-1.5"><Icons.Plus />검사하기</Button>
          </div>
        )}
      </div>
    </div>
  )
}

/* ── Layout & App ────────────────────────────────── */
function Layout() {
  const [open, setOpen] = useState(false)
  return (
    <div className="flex h-screen overflow-hidden">
      {open && <div className="fixed inset-0 bg-black/30 z-40 lg:hidden" onClick={()=>setOpen(false)} />}
      <Sidebar isOpen={open} onClose={()=>setOpen(false)} />
      <div className="flex flex-col flex-1 min-w-0 overflow-hidden">
        <header className="lg:hidden sticky top-0 z-30 flex items-center gap-3 px-4 py-3 bg-white/80 backdrop-blur-md border-b border-violet-100 shrink-0">
          <button onClick={()=>setOpen(true)} className="p-2 rounded-xl hover:bg-violet-50 text-gray-600" aria-label="메뉴"><Icons.Menu /></button>
          <div className="flex items-center gap-2">
            <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-violet-400 to-pink-400 flex items-center justify-center text-white"><Icons.Brain /></div>
            <span className="font-bold text-gray-800 text-sm">MindfulAI</span>
          </div>
        </header>
        <main className="flex-1 overflow-hidden flex flex-col"><Outlet /></main>
      </div>
    </div>
  )
}

function App() {
  return (
    <AppProvider>
      <Routes>
        <Route element={<Layout />}>
          <Route path="/"          element={<Dashboard />}    />
          <Route path="/journal"   element={<JournalPage />}  />
          <Route path="/surveys"   element={<SurveysPage />}  />
          <Route path="/chatbot"   element={<ChatbotPage />}  />
          <Route path="/analytics" element={<AnalyticsPage />}/>
        </Route>
      </Routes>
    </AppProvider>
  )
}

createRoot(document.getElementById('root')).render(
  <HashRouter><App /></HashRouter>
)
</script>
</body>
</html>
